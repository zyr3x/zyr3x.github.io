<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" width="100%" height="100%">
  <defs>
    <!-- Matte Cyan / Indigo / Purple Cyber Gradient -->
    <linearGradient id="matteZrxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Matte Specular Edge Chamfer -->
    <linearGradient id="matteZrxEdge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.15" />
    </linearGradient>

    <!-- Flame Orange Energy Nexus -->
    <linearGradient id="nexusOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#ffa142" />
    </linearGradient>

    <filter id="matteSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3-Letter Monogram: Z R X on 100% Transparent Canvas -->
  <g transform="translate(30, 195)">
    <!-- Letter Z -->
    <path d="M 10 -150 L 145 -150 L 55 -25 L 150 -25 L 140 0 L -5 0 L 85 -125 L 10 -125 Z" fill="url(#matteZrxGrad)" />
    <path d="M 10 -150 L 145 -150 L 130 -142 L 22 -142 Z" fill="url(#matteZrxEdge)" />
    <!-- Z Refraction Facet -->
    <polygon points="120,-125 55,-25 85,-125" fill="#ffffff" fill-opacity="0.12" />

    <!-- Letter R -->
    <g transform="translate(180, 0)">
      <path d="M 0 0 L 0 -150 L 95 -150 C 135 -150 155 -130 155 -95 C 155 -68 138 -52 110 -46 L 160 0 L 122 0 L 78 -42 L 35 -42 L 35 0 Z M 35 -72 L 90 -72 C 112 -72 120 -82 120 -95 C 120 -108 112 -118 90 -118 L 35 -118 Z" fill="url(#matteZrxGrad)" />
      <path d="M 0 -150 L 95 -150 C 130 -150 148 -135 150 -105 L 142 -105 C 140 -130 125 -142 95 -142 L 8 -142 L 8 0 L 0 0 Z" fill="url(#matteZrxEdge)" />
    </g>

    <!-- Letter X -->
    <g transform="translate(375, 0)">
      <path d="M 0 0 L 58 -75 L 2 -150 L 42 -150 L 80 -98 L 118 -150 L 158 -150 L 102 -75 L 160 0 L 120 0 L 80 -52 L 40 0 Z" fill="url(#matteZrxGrad)" />
      <polygon points="2,-150 42,-150 36,-142 10,-142" fill="url(#matteZrxEdge)" />
      <polygon points="118,-150 158,-150 150,-142 124,-142" fill="url(#matteZrxEdge)" />
      
      <!-- Central Orange Energy Nexus -->
      <polygon points="80,-85 89,-75 80,-65 71,-75" fill="url(#nexusOrange)" filter="url(#matteSoftGlow)" />
      <circle cx="80" cy="-75" r="3.5" fill="#ffffff" />
    </g>
  </g>
</svg>
