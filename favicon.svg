<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>

    <!-- Core Brand Gradients -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#ffa142" />
    </linearGradient>

    <linearGradient id="metallicFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" stroke="rgba(255,255,255,0.1)" stroke-width="3" />
  
  <!-- Subtle Hex Tech Grid Ring -->
  <polygon points="256,48 436,152 436,360 256,464 76,360 76,152" fill="none" stroke="rgba(56,189,248,0.18)" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Ambient Flare -->
  <circle cx="256" cy="256" r="140" fill="#38bdf8" fill-opacity="0.12" filter="url(#neonGlow)" />

  <!-- Geometric 3D 'Z' Monogram -->
  <g filter="url(#subtleShadow)" transform="translate(0, 0)">
    
    <!-- Top Horizontal Beam -->
    <path d="M 120 148 L 368 148 L 392 196 L 208 196 L 144 196 Z" fill="url(#cyberGrad)" />
    <!-- Top Highlight Chamfer -->
    <path d="M 120 148 L 368 148 L 340 160 L 144 160 Z" fill="#ffffff" fill-opacity="0.5" />

    <!-- Central High-Velocity Diagonal Slash -->
    <polygon points="392,196 232,316 120,316 280,196" fill="url(#cyberGrad)" />
    
    <!-- Diagonal Facet Light Refraction -->
    <polygon points="340,196 210,300 160,300 290,196" fill="url(#metallicFacet)" />

    <!-- Bottom Horizontal Beam -->
    <path d="M 120 316 L 144 364 L 392 364 L 368 316 Z" fill="url(#cyberGrad)" />
    <!-- Bottom Glow Shadow Chamfer -->
    <path d="M 144 364 L 392 364 L 368 352 L 168 352 Z" fill="#1e1b4b" fill-opacity="0.6" />

    <!-- Quantum Core Node (Central Orange Energy Nexus) -->
    <polygon points="256,236 276,256 256,276 236,256" fill="url(#neonOrange)" filter="url(#neonGlow)" />
    <circle cx="256" cy="256" r="4" fill="#ffffff" />

    <!-- Cyber Circuit Nodes -->
    <circle cx="120" cy="148" r="6" fill="#38bdf8" />
    <circle cx="392" cy="196" r="6" fill="#c084fc" />
    <circle cx="120" cy="316" r="6" fill="#38bdf8" />
    <circle cx="392" cy="364" r="6" fill="#ff6b00" />
  </g>
</svg>
