<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Matte Cyan / Indigo / Purple Cyber Gradient -->
    <linearGradient id="favZGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Matte Specular Top Chamfer -->
    <linearGradient id="favZChamfer" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Flame Orange Energy Nexus -->
    <linearGradient id="favZNexus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#ffa142" />
    </linearGradient>

    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean 1:1 Geometric Z Monogram on 100% Transparent Canvas -->
  <g transform="translate(0, 0)">
    <!-- Top Horizontal Beam -->
    <path d="M 100 136 L 388 136 L 416 192 L 196 192 L 128 192 Z" fill="url(#favZGrad)" />
    <path d="M 100 136 L 388 136 L 356 150 L 128 150 Z" fill="#ffffff" fill-opacity="0.65" />

    <!-- Central High-Velocity Diagonal Slash -->
    <polygon points="416,192 232,328 100,328 284,192" fill="url(#favZGrad)" />
    <!-- Diagonal Refraction Facet -->
    <polygon points="356,192 216,310 156,310 296,192" fill="url(#favZChamfer)" />

    <!-- Bottom Horizontal Beam -->
    <path d="M 100 328 L 128 384 L 416 384 L 388 328 Z" fill="url(#favZGrad)" />
    <path d="M 128 384 L 416 384 L 388 370 L 156 370 Z" fill="#1e1b4b" fill-opacity="0.6" />

    <!-- Central Energy Nexus -->
    <polygon points="256,234 278,256 256,278 234,256" fill="url(#favZNexus)" filter="url(#favGlow)" />
    <circle cx="256" cy="256" r="5" fill="#ffffff" />

    <!-- Corner Nodes -->
    <circle cx="100" cy="136" r="6" fill="#38bdf8" />
    <circle cx="416" cy="192" r="6" fill="#c084fc" />
    <circle cx="100" cy="328" r="6" fill="#38bdf8" />
    <circle cx="416" cy="384" r="6" fill="#ff6b00" />
  </g>
</svg>
