<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#ffa142" />
    </linearGradient>

    <linearGradient id="metallicFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Ambient Flare (Behind Z) -->
  <circle cx="256" cy="256" r="130" fill="#38bdf8" fill-opacity="0.15" filter="url(#neonGlow)" />

  <!-- Geometric 3D 'Z' Monogram on Transparent Background -->
  <g filter="url(#subtleShadow)">
    <!-- Top Horizontal Beam -->
    <path d="M 100 136 L 388 136 L 416 192 L 196 192 L 128 192 Z" fill="url(#cyberGrad)" />
    <!-- Top Highlight Chamfer -->
    <path d="M 100 136 L 388 136 L 356 150 L 128 150 Z" fill="#ffffff" fill-opacity="0.55" />

    <!-- Central High-Velocity Diagonal Slash -->
    <polygon points="416,192 232,328 100,328 284,192" fill="url(#cyberGrad)" />
    
    <!-- Diagonal Facet Light Refraction -->
    <polygon points="356,192 216,310 156,310 296,192" fill="url(#metallicFacet)" />

    <!-- Bottom Horizontal Beam -->
    <path d="M 100 328 L 128 384 L 416 384 L 388 328 Z" fill="url(#cyberGrad)" />
    <!-- Bottom Glow Shadow Chamfer -->
    <path d="M 128 384 L 416 384 L 388 370 L 156 370 Z" fill="#1e1b4b" fill-opacity="0.7" />

    <!-- Quantum Core Node (Central Orange Energy Nexus) -->
    <polygon points="256,234 278,256 256,278 234,256" fill="url(#neonOrange)" filter="url(#neonGlow)" />
    <circle cx="256" cy="256" r="4.5" fill="#ffffff" />

    <!-- Cyber Circuit Nodes -->
    <circle cx="100" cy="136" r="6" fill="#38bdf8" />
    <circle cx="416" cy="192" r="6" fill="#c084fc" />
    <circle cx="100" cy="328" r="6" fill="#38bdf8" />
    <circle cx="416" cy="384" r="6" fill="#ff6b00" />
  </g>
</svg>
