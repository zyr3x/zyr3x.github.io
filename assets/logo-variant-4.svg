<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <style>
      .adaptive-hull { fill: #f1f5f9; stroke: #0f172a; stroke-width: 2.5; }
      .adaptive-highlight { fill: #ffffff; }
      .adaptive-core { fill: #ff6b00; }
      
      @media (prefers-color-scheme: light) {
        .adaptive-hull { fill: #0f172a; stroke: #cbd5e1; stroke-width: 2.5; }
        .adaptive-highlight { fill: #38bdf8; }
        .adaptive-core { fill: #ff6b00; }
      }
    </style>
  </defs>

  <!-- Variant 4: Theme-Adaptive CSS Inverting Hull -->
  <g transform="translate(30, 195)">
    <!-- Letter Z -->
    <path class="adaptive-hull" d="M 10 -150 L 145 -150 L 55 -25 L 150 -25 L 140 0 L -5 0 L 85 -125 L 10 -125 Z" />
    <path class="adaptive-highlight" d="M 10 -150 L 145 -150 L 130 -142 L 22 -142 Z" />

    <!-- Letter R -->
    <g transform="translate(180, 0)">
      <path class="adaptive-hull" d="M 0 0 L 0 -150 L 95 -150 C 135 -150 155 -130 155 -95 C 155 -68 138 -52 110 -46 L 160 0 L 122 0 L 78 -42 L 35 -42 L 35 0 Z M 35 -72 L 90 -72 C 112 -72 120 -82 120 -95 C 120 -108 112 -118 90 -118 L 35 -118 Z" />
    </g>

    <!-- Letter X -->
    <g transform="translate(375, 0)">
      <path class="adaptive-hull" d="M 0 0 L 58 -75 L 2 -150 L 42 -150 L 80 -98 L 118 -150 L 158 -150 L 102 -75 L 160 0 L 120 0 L 80 -52 L 40 0 Z" />
      <polygon class="adaptive-core" points="80,-85 89,-75 80,-65 71,-75" />
      <circle cx="80" cy="-75" r="3" fill="#ffffff" />
    </g>
  </g>
</svg>
