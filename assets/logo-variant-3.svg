    <g transform="translate(375, 0)">
      <polygon points="80,-85 89,-75 80,-65 71,-75" fill="url(#v3Orange)" stroke="#090d16" stroke-width="1.5" />
      <circle cx="80" cy="-75" r="2.5" fill="#ffffff" />
    </g>
