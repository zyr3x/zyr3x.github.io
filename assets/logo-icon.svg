<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="zrxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="zrxOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#ffa142" />
    </linearGradient>
  </defs>

  <!-- Clean Pure Vector: Z R X (No blur, no background) -->
  <g transform="translate(30, 195)">
    <!-- Letter Z -->
    <path d="M 10 -150 L 145 -150 L 55 -25 L 150 -25 L 140 0 L -5 0 L 85 -125 L 10 -125 Z" fill="url(#zrxGrad)" />
    <path d="M 10 -150 L 145 -150 L 130 -140 L 25 -140 Z" fill="#ffffff" fill-opacity="0.6" />

    <!-- Letter R -->
    <g transform="translate(180, 0)">
      <path d="M 0 0 L 0 -150 L 95 -150 C 135 -150 155 -130 155 -95 C 155 -68 138 -52 110 -46 L 160 0 L 125 0 L 80 -42 L 35 -42 L 35 0 Z M 35 -72 L 90 -72 C 112 -72 120 -82 120 -95 C 120 -108 112 -118 90 -118 L 35 -118 Z" fill="url(#zrxGrad)" />
    </g>

    <!-- Letter X -->
    <g transform="translate(375, 0)">
      <path d="M 0 0 L 58 -75 L 2 -150 L 42 -150 L 80 -98 L 118 -150 L 158 -150 L 102 -75 L 160 0 L 120 0 L 80 -52 L 40 0 Z" fill="url(#zrxGrad)" />
      <!-- X Center Orange Nexus Core -->
      <polygon points="80,-85 90,-75 80,-65 70,-75" fill="url(#zrxOrange)" />
      <circle cx="80" cy="-75" r="3.5" fill="#ffffff" />
    </g>
  </g>
</svg>
