<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="v2Light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="v2Mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="v2Dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="v2CyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Variant 2: 3D Faceted Diamond Hull (Universal Light & Dark Contrast) -->
  <g transform="translate(30, 195)">
    <!-- Letter Z Facets -->
    <polygon points="10,-150 145,-150 125,-128 35,-128" fill="url(#v2Light)" />
    <polygon points="145,-150 125,-128 55,-25 75,-48" fill="url(#v2Dark)" />
    <polygon points="125,-128 55,-25 85,-125" fill="url(#v2Mid)" />
    <polygon points="55,-25 150,-25 140,0 -5,0" fill="url(#v2Dark)" />
    <polygon points="55,-25 150,-25 135,-15 15,-15" fill="url(#v2Light)" />

    <!-- Letter R Facets -->
    <g transform="translate(180, 0)">
      <polygon points="0,0 0,-150 35,-150 35,0" fill="url(#v2Dark)" />
      <polygon points="0,-150 35,-150 25,-125 0,-125" fill="url(#v2Light)" />
      <path d="M 35 -150 L 95 -150 C 135 -150 155 -130 155 -95 C 155 -68 138 -52 110 -46 L 125 -46 C 145 -52 155 -68 155 -95 C 155 -130 135 -150 95 -150 Z" fill="url(#v2Light)" />
      <path d="M 35 -42 L 80 -42 L 122 0 L 160 0 L 110 -46 L 80 -42 Z" fill="url(#v2Mid)" />
      <polygon points="110,-46 80,-42 122,0 138,-5" fill="url(#v2Dark)" />
      <path d="M 35 -118 L 90 -118 C 112 -118 120 -108 120 -95 C 120 -82 112 -72 90 -72 L 35 -72 Z" fill="url(#v2Dark)" />
    </g>

    <!-- Letter X Facets -->
    <g transform="translate(375, 0)">
      <polygon points="2,-150 42,-150 120,0 80,0" fill="url(#v2Light)" />
      <polygon points="118,-150 158,-150 40,0 0,0" fill="url(#v2Dark)" />
      <polygon points="58,-75 80,-52 102,-75 80,-98" fill="url(#v2Mid)" />
      <polygon points="73,-75 80,-68 87,-75 80,-82" fill="url(#v2CyanAccent)" />
      <circle cx="80" cy="-75" r="2.5" fill="#ffffff" />
    </g>
  </g>
</svg>
