<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" width="100%" height="140">
  <defs>
    <linearGradient id="fullTitanium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="48%" stop-color="#94a3b8" />
      <stop offset="52%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="titleMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <style>
    .brand-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; font-size: 38px; fill: url(#titleMetal); letter-spacing: 3px; }
    .brand-sub { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 600; font-size: 11px; fill: #94a3b8; letter-spacing: 2.5px; text-transform: uppercase; }
  </style>

  <!-- Left Spaceship Armor Monogram: Z R X -->
  <g transform="translate(10, 105) scale(0.6)">
    <!-- Z -->
    <path d="M 10 -150 L 145 -150 L 55 -25 L 150 -25 L 140 0 L -5 0 L 85 -125 L 10 -125 Z" fill="url(#fullTitanium)" />
    <path d="M 10 -150 L 145 -150 L 130 -142 L 22 -142 Z" fill="#ffffff" />
    <!-- R -->
    <g transform="translate(180, 0)">
      <path d="M 0 0 L 0 -150 L 95 -150 C 135 -150 155 -130 155 -95 C 155 -68 138 -52 110 -46 L 160 0 L 122 0 L 78 -42 L 35 -42 L 35 0 Z M 35 -72 L 90 -72 C 112 -72 120 -82 120 -95 C 120 -108 112 -118 90 -118 L 35 -118 Z" fill="url(#fullTitanium)" />
    </g>
    <!-- X -->
    <g transform="translate(375, 0)">
      <path d="M 0 0 L 58 -75 L 2 -150 L 42 -150 L 80 -98 L 118 -150 L 158 -150 L 102 -75 L 160 0 L 120 0 L 80 -52 L 40 0 Z" fill="url(#fullTitanium)" />
      <polygon points="80,-85 89,-75 80,-65 71,-75" fill="#ff6b00" />
      <circle cx="80" cy="-75" r="3" fill="#ffffff" />
    </g>
  </g>

  <!-- Right Typography -->
  <g transform="translate(365, 68)">
    <text x="0" y="0" class="brand-title">OLEG SEMENOV</text>
    <text x="2" y="24" class="brand-sub">CTO @ BELVG • AI SYSTEMS ARCHITECT</text>
  </g>
</svg>
