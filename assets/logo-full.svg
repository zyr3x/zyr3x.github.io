<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="100%" height="140">
  <defs>
    <linearGradient id="fullCyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .brand-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; font-size: 42px; fill: url(#textGrad); letter-spacing: 4px; }
    .sub-text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 600; font-size: 11px; fill: #38bdf8; letter-spacing: 3px; text-transform: uppercase; }
  </style>

  <!-- Left Icon Monogram -->
  <g transform="translate(10, 10) scale(0.235)">
    <!-- Base -->
    <rect width="512" height="512" rx="110" fill="#0b101d" stroke="rgba(255,255,255,0.12)" stroke-width="6" />
    
    <!-- Z Monogram -->
    <path d="M 120 148 L 368 148 L 392 196 L 208 196 L 144 196 Z" fill="url(#fullCyberGrad)" />
    <path d="M 120 148 L 368 148 L 340 160 L 144 160 Z" fill="#ffffff" fill-opacity="0.6" />
    <polygon points="392,196 232,316 120,316 280,196" fill="url(#fullCyberGrad)" />
    <path d="M 120 316 L 144 364 L 392 364 L 368 316 Z" fill="url(#fullCyberGrad)" />
    
    <!-- Nexus Core -->
    <polygon points="256,236 276,256 256,276 236,256" fill="#ff6b00" filter="url(#logoGlow)" />
    <circle cx="256" cy="256" r="5" fill="#ffffff" />
  </g>

  <!-- Typography Wordmark -->
  <g transform="translate(150, 68)">
    <text x="0" y="0" class="brand-text">ZYR3X<tspan fill="#38bdf8">.</tspan></text>
    <text x="2" y="26" class="sub-text">CTO @ BELVG • AI SYSTEMS ARCHITECT</text>
  </g>
</svg>
