<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" width="100%" height="160">
  <style>
    .gh-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .card-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 6px; }
    .metric-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; }
    .metric-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #c9d1d9; }
    .metric-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #8b949e; }
  </style>

  <!-- Container -->
  <rect width="840" height="160" fill="transparent" />

  <!-- Card 1: 3,200+ Contributions -->
  <g transform="translate(0, 10)">
    <rect width="200" height="140" class="card-bg" />
    <text x="16" y="42" class="metric-title" fill="#58a6ff">🚀 3,200+</text>
    <text x="16" y="74" class="metric-label">Contributions / Year</text>
    <text x="16" y="98" class="metric-sub">High-velocity commits</text>
    <text x="16" y="116" class="metric-sub">&amp; system architecture</text>
  </g>

  <!-- Card 2: 15+ Yrs Experience -->
  <g transform="translate(213, 10)">
    <rect width="200" height="140" class="card-bg" />
    <text x="16" y="42" class="metric-title" fill="#7ee787">🏛️ 15+ Yrs</text>
    <text x="16" y="74" class="metric-label">Enterprise eCommerce</text>
    <text x="16" y="98" class="metric-sub">Scalable architectures &amp;</text>
    <text x="16" y="116" class="metric-sub">high-load optimization</text>
  </g>

  <!-- Card 3: 75+ Repositories -->
  <g transform="translate(426, 10)">
    <rect width="200" height="140" class="card-bg" />
    <text x="16" y="42" class="metric-title" fill="#f0883e">📦 75+</text>
    <text x="16" y="74" class="metric-label">Repositories Built</text>
    <text x="16" y="98" class="metric-sub">Open-source tooling,</text>
    <text x="16" y="116" class="metric-sub">APIs &amp; core platforms</text>
  </g>

  <!-- Card 4: AI Agents & MCP -->
  <g transform="translate(640, 10)">
    <rect width="200" height="140" class="card-bg" />
    <text x="16" y="42" class="metric-title" fill="#d2a8ff">🤖 AI Agents</text>
    <text x="16" y="74" class="metric-label">Multi-Agent &amp; MCP</text>
    <text x="16" y="98" class="metric-sub">Autonomous toolchains</text>
    <text x="16" y="116" class="metric-sub">&amp; LLM proxy engineering</text>
  </g>
</svg>
