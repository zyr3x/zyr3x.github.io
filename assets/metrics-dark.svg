<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 140" width="100%" height="140">
  <style>
    .card-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 6px; }
    .metric-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; }
    .metric-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #c9d1d9; }
    .metric-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #8b949e; }
  </style>

  <rect width="840" height="140" fill="transparent" />

  <!-- Card 1 -->
  <g transform="translate(0, 5)">
    <rect width="200" height="126" class="card-bg" />
    <text x="16" y="38" class="metric-title" fill="#58a6ff">🚀 3,200+</text>
    <text x="16" y="68" class="metric-label">Contributions / Year</text>
    <text x="16" y="90" class="metric-sub">High-velocity commits</text>
    <text x="16" y="106" class="metric-sub">&amp; system architecture</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(213, 5)">
    <rect width="200" height="126" class="card-bg" />
    <text x="16" y="38" class="metric-title" fill="#7ee787">🏛️ 15+ Yrs</text>
    <text x="16" y="68" class="metric-label">Enterprise eCommerce</text>
    <text x="16" y="90" class="metric-sub">Scalable architectures &amp;</text>
    <text x="16" y="106" class="metric-sub">high-load optimization</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(426, 5)">
    <rect width="200" height="126" class="card-bg" />
    <text x="16" y="38" class="metric-title" fill="#f0883e">📦 75+</text>
    <text x="16" y="68" class="metric-label">Repositories Built</text>
    <text x="16" y="90" class="metric-sub">Open-source tooling,</text>
    <text x="16" y="106" class="metric-sub">APIs &amp; core platforms</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(640, 5)">
    <rect width="200" height="126" class="card-bg" />
    <text x="16" y="38" class="metric-title" fill="#79c0ff">🤖 AI Agents</text>
    <text x="16" y="68" class="metric-label">Multi-Agent &amp; MCP</text>
    <text x="16" y="90" class="metric-sub">Autonomous toolchains</text>
    <text x="16" y="106" class="metric-sub">&amp; LLM proxy engineering</text>
  </g>
</svg>
